<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#142138"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d1117"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="A.R.I.D. staff dashboard for monitoring synced dengue vector breeding-site reports."
    />
    <!-- Montserrat is self-hosted from /fonts and declared in index.css, so
         there is no third-party font request to block first paint. Preloaded
         because the @font-face sits inside the stylesheet: without this the
         browser cannot discover the file until the CSS has parsed. -->
    <link
      rel="preload"
      href="/fonts/Montserrat-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>A.R.I.D. Monitoring</title>
    <script>
      // Stamp the theme before first paint, or the app renders light and then
      // flips. Resolves "system" here so the stylesheet needs one selector.
      ;(function () {
        try {
          var saved = localStorage.getItem('arid-theme')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
